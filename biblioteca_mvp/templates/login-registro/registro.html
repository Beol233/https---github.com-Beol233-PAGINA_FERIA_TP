<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="/static/css/registro.css">
</head>

<body>
    <header>

    </header>
    <main class="parte-principal">
        <div class="imagen-grande">
            <img src="/static/img/harrypote.jpg" alt="">
        </div>
        <div class="registro-usuario">
            <form action="" class="registro-completo">
                <span class="rgs">Bienvenidos a registrarse</span>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre">
                </div>
                <div class="campo">
                    <label for="apellido">Apellido paterno</label>
                    <input type="text" id="apellido" name="apellido">
                </div>
                <div class="campo">
                    <label for="contraseña">Contraseña</label>
                    <input type="password" name="contraseña" id="contraseña">
                </div>
                <div class="campo">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" name="confirmar" id="confirmar">
                </div>
                <div class="campo">
                    <label for="gmail">Gmail</label>
                    <input type="text" id="gmail" name="gmail">
                </div>
                <div class="recordar">
                    <input type="checkbox" name="recordar" id="recordar">
                    <label for="recordar">Recordar datos</label>
                </div>
                <div>
                    <button class="registrar">Registrate</button>
                </div>
            </form>
        </div>
    </main>
    <footer>

    </footer>
</body>

</html>
