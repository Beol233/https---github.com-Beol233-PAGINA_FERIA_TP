<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        {% if usuario %}

            Editar usuario

        {% else %}

            Nuevo usuario

        {% endif %}

    </title>


    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/Formulario_usuario.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>


<main class="contenedor-usuario">

    <a href="{{ url_for('gestion_usuarios') }}" class="boton-volver">
        <i class="bi bi-arrow-left"></i>
        Volver
    </a>

    <div class="encabezado-usuario">
        <div class="icono-usuario">
            <i class="bi bi-person-plus"></i>
        </div>

        <div>
            <h1>
                {% if usuario %}
                    Editar usuario
                {% else %}
                    Nuevo usuario
                {% endif %}
            </h1>

            <p>
                {% if usuario %}
                    Modifica la información del usuario.
                {% else %}
                    Registra un nuevo lector en Libroteca.
                {% endif %}
            </p>
        </div>
    </div>

    {% if usuario %}
        <form
            action="{{ url_for('editar_usuario', usuario_id=usuario.id) }}"
            method="POST"
            class="formulario-usuario"
        >
    {% else %}
        <form
            action="{{ url_for('agregar_usuario') }}"
            method="POST"
            class="formulario-usuario"
        >
    {% endif %}

        <div class="campo-usuario">
            <label for="nombre">
                <i class="bi bi-person"></i>
                Nombre
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                value="{{ usuario.nombre if usuario else '' }}"
                placeholder="Ingrese el nombre"
                required
            >
        </div>

        <div class="campo-usuario">
            <label for="apellido">
                <i class="bi bi-person"></i>
                Apellido
            </label>

            <input
                type="text"
                id="apellido"
                name="apellido"
                value="{{ usuario.apellido if usuario else '' }}"
                placeholder="Ingrese el apellido"
                required
            >
        </div>

        <div class="campo-usuario campo-completo">
            <label for="correo">
                <i class="bi bi-envelope"></i>
                Correo
            </label>

            <input
                type="email"
                id="correo"
                name="correo"
                value="{{ usuario.correo if usuario else '' }}"
                placeholder="ejemplo@correo.cl"
                required
            >
        </div>

        <div class="campo-usuario">
            <label for="matricula">
                <i class="bi bi-card-text"></i>
                Matrícula
            </label>

            <input
                type="text"
                id="matricula"
                name="matricula"
                value="{{ usuario.matricula if usuario and usuario.matricula else '' }}"
                placeholder="Número de matrícula"
            >
        </div>

    {% if not usuario %}
        
        <!-- CONTRASEÑA -->
        <div class="campo-usuario">
        
            <label for="password">
                <i class="bi bi-lock"></i>
                Contraseña
            </label>
        
            <div class="campo-password">
            
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese una contraseña"
                    required
                >
            
                <button
                    type="button"
                    class="boton-ver-password"
                    id="verPassword"
                    aria-label="Mostrar contraseña"
                >
                    <i class="bi bi-eye"></i>
                </button>
            
            </div>
        
        </div>
    
    
        <!-- CONFIRMAR CONTRASEÑA -->
        <div class="campo-usuario">
        
            <label for="confirmar">
                <i class="bi bi-shield-lock"></i>
                Confirmar contraseña
            </label>
        
            <div class="campo-password">
            
                <input
                    type="password"
                    id="confirmar"
                    name="confirmar"
                    placeholder="Repita la contraseña"
                    required
                >
            
                <button
                    type="button"
                    class="boton-ver-password"
                    id="verConfirmar"
                    aria-label="Mostrar contraseña"
                >
                    <i class="bi bi-eye"></i>
                </button>
            
            </div>
        
        </div>
    
    {% endif %}
        <div class="campo-usuario campo-completo">
            <label for="rol_id">
                <i class="bi bi-person-badge"></i>
                Tipo de usuario
            </label>

            <select
                id="rol_id"
                name="rol_id"
                required
            >
                <option value="">
                    Seleccionar rol
                </option>

                {% for rol in roles %}
                    <option
                        value="{{ rol.id }}"
                        {% if usuario and usuario.rol_id == rol.id %}
                            selected
                        {% endif %}
                    >
                        {{ rol.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="acciones-formulario">
            <a
                href="{{ url_for('gestion_usuarios') }}"
                class="boton-cancelar"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="boton-guardar"
            >
                <i class="bi bi-check-lg"></i>

                {% if usuario %}
                    Guardar cambios
                {% else %}
                    Crear usuario
                {% endif %}
            </button>
        </div>

    </form>

</main>


<script src="/static/js/tema.js"></script>
<script src="/static/js/Formulario_usuario.js"></script>

</body>

</html>
