<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="/static/css/registro.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header>

    </header>
    <main class="parte-principal">
        <div class="imagen-grande">
            <img src="{{ url_for('static', filename='img/imgbiblioteca.jpg') }}" alt="Harry Potter" class="imagen-portada">

        </div>
        <div class="registro-usuario">
            <form method="post" class="registro-completo" action="{{url_for('registro_process')}}">
                <span class="rgs">Bienvenidos a registrarse</span>
                <span >Selecciona tu perfil y accede a tu coleccion personal</span>
                {% with mensajes = get_flashed_messages() %}
                    {% if mensajes %}
                        <ul class="mensajes-flash">
                            {% for mensaje in mensajes %}
                                <li>{{ mensaje }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}
                {% endwith %}
                <!--Tipo de usuario-->
                <div class="tipo-de-usuario">
                    
                    <label for="tipo_usuario">Tipo de usuario</label>
                    
                    <div class="tipo_usuario">
                        <input type="hidden" name="tipo_usuario" id="tipo_usuario">
                        
                        <button type="button" class="btn-usuario" data-tipo="alumno">ALUMNO</button>
                        
                        <button type="button" class="btn-usuario" data-tipo="profesor">PROFESOR</button>
                        
                        <Button type="button" class="btn-usuario" data-tipo="admin">ADMIN</Button>
                    </div>
                </div>
                <!--Nombre-->
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <!--Apellido-->
                <div class="campo">
                    <label for="apellido">Apellido paterno</label>
                    <input type="text" id="apellido" name="apellido" required>
                </div>
                <!--Contraseña-->
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" required>
                </div>
                <!--Confirmat contraseña-->
                <div class="campo">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" name="confirmar" id="confirmar" required>
                </div>
                <!--Correo-->
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <!--recordar datos-->
                <div class="recordar">
                    <input type="checkbox" name="recordar" id="recordar">
                    <label for="recordar">Recordar datos</label>
                </div>
                <div>
                    <button class="registrar">Registrate</button>
                </div>
            </form>
        </div>
    </main>
    <footer>

    </footer>
    <script>
    // OJO: antes esta línea no existía. Sin ella, "tipoUsuario" no
    // estaba definido en ningún lado y el click en ALUMNO/PROFESOR/ADMIN
    // lanzaba un error de JavaScript (se veía en la consola del navegador,
    // F12 -> Console) y nunca llegaba a llenar el input oculto. Por eso
    // el formulario siempre se enviaba con tipo_usuario vacío, y por eso
    // app.py siempre respondía "Seleccione un tipo de usuario" aunque
    // sí se hubiera hecho clic en un botón.
    const tipoUsuario = document.getElementById("tipo_usuario");
    const botones = document.querySelectorAll(".btn-usuario");

    botones.forEach(boton => {
        boton.addEventListener("click", function(event){
            event.preventDefault();

            botones.forEach(btn => {
                btn.classList.remove("activo");
            });

            this.classList.add("activo");

            // También era un typo: "datasat" -> "dataset"
            tipoUsuario.value = this.dataset.tipo;
        });
    });
</script>

</body>

</html>
