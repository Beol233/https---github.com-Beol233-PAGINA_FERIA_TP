<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        {% if libro %}
            Editar libro
        {% else %}
            Agregar libro
        {% endif %}
    </title>

    <link rel="stylesheet" href="/static/css/style.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>


<main
    style="
        max-width: 700px;
        margin: 50px auto;
        background: white;
        padding: 35px;
        border-radius: 10px;
    "
>


    <a href="{{ url_for('gestion_libros') }}">

        <i class="bi bi-arrow-left"></i>

        Volver

    </a>


    <h1 style="margin-top: 25px;">

        {% if libro %}

            Editar libro

        {% else %}

            Agregar nuevo libro

        {% endif %}

    </h1>


    {% if libro %}

        <form
            action="{{ url_for(
                'editar_libro',
                libro_id=libro.id
            ) }}"
            method="POST"
        >

    {% else %}

        <form
            action="{{ url_for('agregar_libro') }}"
            method="POST"
        >

    {% endif %}


        <div>

            <label for="titulo">
                Título *
            </label>

            <input
                type="text"
                id="titulo"
                name="titulo"
                value="{{ libro.titulo if libro else '' }}"
                required
            >

        </div>


        <div>

            <label for="autor">
                Autor *
            </label>

            <input
                type="text"
                id="autor"
                name="autor"
                value="{{ libro.autor if libro else '' }}"
                required
            >

        </div>


        <div>

            <label for="isbn">
                ISBN
            </label>

            <input
                type="text"
                id="isbn"
                name="isbn"
                value="{{ libro.isbn if libro and libro.isbn else '' }}"
            >

        </div>


        <div>

            <label for="editorial">
                Editorial
            </label>

            <input
                type="text"
                id="editorial"
                name="editorial"
                value="{{ libro.editorial if libro and libro.editorial else '' }}"
            >

        </div>


        <div>

            <label for="anio">
                Año
            </label>

            <input
                type="number"
                id="anio"
                name="anio"
                value="{{ libro.anio if libro and libro.anio else '' }}"
            >

        </div>


        <div>

            <label for="cantidad_total">
                Cantidad total
            </label>

            <input
                type="number"
                id="cantidad_total"
                name="cantidad_total"
                min="1"
                value="{{ libro.cantidad_total if libro else 1 }}"
                required
            >

        </div>


        <div>

            <label for="categoria_id">
                Categoría
            </label>

            <select
                id="categoria_id"
                name="categoria_id"
                required
            >

                <option value="">
                    Seleccionar categoría
                </option>


                {% for categoria in categorias %}

                    <option
                        value="{{ categoria.id }}"

                        {% if libro and libro.categoria_id == categoria.id %}
                            selected
                        {% endif %}
                    >

                        {{ categoria.nombre }}

                    </option>

                {% endfor %}

            </select>

        </div>


        <div>

            <label for="portada_url">
                URL de portada
            </label>

            <input
                type="text"
                id="portada_url"
                name="portada_url"
                value="{{ libro.portada_url if libro and libro.portada_url else '' }}"
                placeholder="https://..."
            >

        </div>


        <button
            type="submit"
            style="margin-top: 25px;"
        >

            {% if libro %}

                Guardar cambios

            {% else %}

                Agregar libro

            {% endif %}

        </button>


    </form>

</main>


<script src="/static/js/tema.js"></script>

</body>

</html>
