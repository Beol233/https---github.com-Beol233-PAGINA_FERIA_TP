<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        {% if libro %}
            Editar libro
        {% else %}
            Agregar libro
        {% endif %}
    </title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/Formulario_Libro.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>


<main class="contenedor-libro">

    <a href="{{ url_for('gestion_libros') }}" class="boton-volver">
        <i class="bi bi-arrow-left"></i>
        Volver
    </a>

    <div class="encabezado-libro">

        <div class="icono-libro">
            <i class="bi bi-book"></i>
        </div>

        <div>
            <h1>
                {% if libro %}
                    Editar libro
                {% else %}
                    Agregar nuevo libro
                {% endif %}
            </h1>

            <p>
                {% if libro %}
                    Modifica la información del libro.
                {% else %}
                    Registra un nuevo libro en la colección de Libroteca.
                {% endif %}
            </p>
        </div>

    </div>


    {% if libro %}

        <form
            action="{{ url_for('editar_libro', libro_id=libro.id) }}"
            method="POST"
            class="formulario-libro"
        >

    {% else %}

        <form
            action="{{ url_for('agregar_libro') }}"
            method="POST"
            class="formulario-libro"
        >

    {% endif %}


        <div class="campo-libro">

            <label for="titulo">
                <i class="bi bi-book"></i>
                Título *
            </label>

            <input
                type="text"
                id="titulo"
                name="titulo"
                value="{{ libro.titulo if libro else '' }}"
                placeholder="Nombre del libro"
                required
            >

        </div>


        <div class="campo-libro">

            <label for="autor">
                <i class="bi bi-person"></i>
                Autor *
            </label>

            <input
                type="text"
                id="autor"
                name="autor"
                value="{{ libro.autor if libro else '' }}"
                placeholder="Nombre del autor"
                required
            >

        </div>


        <div class="campo-libro">

            <label for="isbn">
                <i class="bi bi-upc-scan"></i>
                ISBN
            </label>

            <input
                type="text"
                id="isbn"
                name="isbn"
                value="{{ libro.isbn if libro and libro.isbn else '' }}"
                placeholder="Ej: 978956..."
            >

        </div>


        <div class="campo-libro">

            <label for="editorial">
                <i class="bi bi-building"></i>
                Editorial
            </label>

            <input
                type="text"
                id="editorial"
                name="editorial"
                value="{{ libro.editorial if libro and libro.editorial else '' }}"
                placeholder="Nombre de la editorial"
            >

        </div>


        <div class="campo-libro">

            <label for="anio">
                <i class="bi bi-calendar3"></i>
                Año
            </label>

            <input
                type="number"
                id="anio"
                name="anio"
                value="{{ libro.anio if libro and libro.anio else '' }}"
                placeholder="Ej: 2024"
            >

        </div>


        <div class="campo-libro">

            <label for="cantidad_total">
                <i class="bi bi-stack"></i>
                Cantidad total
            </label>

            <input
                type="number"
                id="cantidad_total"
                name="cantidad_total"
                min="1"
                value="{{ libro.cantidad_total if libro else 1 }}"
                required
            >

        </div>


        <div class="campo-libro campo-completo">

            <label for="categoria_id">
                <i class="bi bi-tags"></i>
                Categoría
            </label>

            <select
                id="categoria_id"
                name="categoria_id"
                required
            >

                <option value="">
                    Seleccionar categoría
                </option>

                {% for categoria in categorias %}

                    <option
                        value="{{ categoria.id }}"
                        {% if libro and libro.categoria_id == categoria.id %}
                            selected
                        {% endif %}
                    >
                        {{ categoria.nombre }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="campo-libro campo-completo">

            <label for="portada_url">
                <i class="bi bi-image"></i>
                URL de portada
            </label>

            <input
                type="text"
                id="portada_url"
                name="portada_url"
                value="{{ libro.portada_url if libro and libro.portada_url else '' }}"
                placeholder="https://..."
            >

        </div>


        <div class="acciones-libro">

            <a
                href="{{ url_for('gestion_libros') }}"
                class="boton-cancelar"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="boton-guardar-libro"
            >

                <i class="bi bi-check-lg"></i>

                {% if libro %}
                    Guardar cambios
                {% else %}
                    Agregar libro
                {% endif %}

            </button>

        </div>

    </form>

</main>


<script src="/static/js/tema.js"></script>

</body>

</html>
