<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Libros</title>

    <link rel="stylesheet" href="/static/css/libros.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="barra_lateral">
        <h1 class="titulo_barraLateral">Libroteca</h1>
        <p>Tu rincón de lectura</p>
    </div>

    <div class="contenido_principal">

        <header>

            <h1>Colección</h1>

            <button class="header_botton">
                <a href="{{ url_for('libros') }}">Colección</a>
            </button>

            <button class="header_botton">
                <a href="#">Préstamos</a>
            </button>

            <button class="icono_barra" id="btnEscaner">
                <i class="bi bi-upc-scan"></i>
            </button>

            <form action="/buscar" method="get" role="search">

                <label for="busqueda">Buscar:</label>
                <div class="contenedor_btn">
                    <i class="bi bi-search" id="icono_busqueda"></i>
                    <input type="search" class="btn_busqueda_libro" id="busqueda" name="q"
                        placeholder="¿Qué estás buscando?" aria-label="Buscar en el sitio">
                </div>

            </form>

            <button class="icono_barra">
                <i class="bi bi-person-circle"></i>
            </button>

        </header>

        <!-- Escáner -->
        <div id="contenedorScanner" style="display:none; margin-top:30px;">

            <h2>Escanee un código de barras</h2>

            <p>
                Pase el lector por el código de barras.
            </p>

            <!-- Input oculto que recibe el código del escáner -->
            <input
                type="text"
                id="scanner"
                autocomplete="off"
                autofocus
                style="position:absolute; left:-9999px;">

            <p id="resultado" style="font-size:20px;font-weight:bold;"></p>

        </div>

    </div>

<script>

const boton = document.getElementById("btnEscaner");
const contenedor = document.getElementById("contenedorScanner");
const scanner = document.getElementById("scanner");
const resultado = document.getElementById("resultado");

let activo = false;

// Mostrar/Ocultar lector
boton.addEventListener("click", () => {

    activo = !activo;

    if (activo) {

        contenedor.style.display = "block";

        resultado.innerHTML = "Esperando lectura...";

        scanner.focus();

    } else {

        contenedor.style.display = "none";

        scanner.value = "";

    }

});

// Mantener el foco en el input oculto
window.addEventListener("click", () => {

    if (activo) {
        scanner.focus();
    }

});

// Cuando el escáner envía ENTER
scanner.addEventListener("keydown", async function(e){

    if(e.key !== "Enter") return;

    e.preventDefault();

    const codigo = scanner.value.trim();

    scanner.value = "";

    if(codigo === "") return;

    resultado.innerHTML =
        "<strong>Código:</strong> " + codigo;

    try{

        const respuesta = await fetch("/buscar_codigo",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                codigo:codigo
            })

        });

        const libro = await respuesta.json();

        if(libro.encontrado){

            alert(
                "Libro encontrado\n\n" +
                "Título: " + libro.titulo +
                "\nAutor: " + libro.autor +
                "\nEditorial: " + libro.editorial
            );

        }else{

            alert("Libro no registrado.");

        }

    }catch(error){

        console.error(error);

        alert("Error al consultar el servidor.");

    }

    scanner.focus();

});

</script>

</body>
</html>
