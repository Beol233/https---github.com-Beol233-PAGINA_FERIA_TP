<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajustes</title>

    <link rel="stylesheet" href="/static/css/ajustes.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="contenedor_ajustes">

        <div class="titulo_ajustes">

            <a href="{{ url_for('libros') }}" class="boton_volver">
                <i class="bi bi-arrow-left"></i>
            </a>

            <h1>Ajustes</h1>

        </div>

        <div class="opcion_ajuste">

            <div>
                <h2>Modo oscuro</h2>
                <p>Cambiar los colores de la página.</p>
            </div>

            <input type="checkbox" id="modoOscuro">

        </div>

        <div class="opcion_ajuste">

            <div>
                <h2>Notificaciones</h2>
                <p>Recibir avisos de préstamos.</p>
            </div>

            <input type="checkbox" id="notificaciones">

        </div>

        <div class="opcion_ajuste">

            <div>
                <h2>Idioma</h2>
                <p>Selecciona el idioma de la página.</p>
            </div>

            <select id="idioma">
                <option value="es">Español</option>
                <option value="en">Inglés</option>
            </select>

        </div>

    </div>

<script src="/static/js/ajustes.js"></script>

</body>

</html>
